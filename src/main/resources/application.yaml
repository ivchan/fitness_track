server:
  servlet:
    context-path: ""
  port: 8080

spring:
  profiles:
    active: test
  application:
    name: ftrack
  config:
    import: 
      - optional:file:/opt/app/ftrack/env.yaml
  mongodb:
    uri: mongodb://localhost:27017/ftrackdb

logging:
  level:
    org.springframework.data.mongodb: DEBUG
    org.mongodb.driver: DEBUG
